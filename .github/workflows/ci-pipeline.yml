name: My First CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Tests
      run: python app.py

    # --- NEW CD SIMULATION STEP ---
    - name: Package production artifact
      if: success() # Only run this step if all previous steps passed!
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: app.py
